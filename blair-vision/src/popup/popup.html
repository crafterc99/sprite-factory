<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blair Vision</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header><strong>Blair Vision</strong><span id="status" class="pill off">Off</span></header>
  <p id="host" class="muted"></p>
  <p class="muted small">Off by default. Nothing leaves this tab until you enable it.</p>
  <div class="btns">
    <button id="enable" class="primary">Enable on this tab</button>
    <button id="pause" hidden>Pause</button>
    <button id="disable" hidden>Disable</button>
  </div>
  <button id="visual" hidden>Analyze visible content (one screenshot)</button>
  <p id="msg" class="msg" role="status"></p>
  <footer><a href="#" id="settings">Settings &amp; statistics</a></footer>
  <script src="popup.js"></script>
</body>
</html>
