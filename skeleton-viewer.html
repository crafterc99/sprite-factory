<script>
// ─── renderer ──────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(devicePixelRatio);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a14);
scene.fog = new THREE.FogExp2(0x0a0a14, 0.35);

const camera = new THREE.PerspectiveCamera(50,1,0.01,100);
camera.position.set(0, 0.8, 2.8);
camera.lookAt(0, 0, 0);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.2, 0);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.minDistance = 0.5; controls.maxDistance = 8;

// ─── lights ────────────────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0x334466, 1.5));
const sun = new THREE.DirectionalLight(0xffffff, 2.5);
sun.position.set(2, 4, 3); sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048); sun.shadow.camera.near = 0.1; sun.shadow.camera.far = 20;
sun.shadow.camera.left = -3; sun.shadow.camera.right = 3;
sun.shadow.camera.top = 4; sun.shadow.camera.bottom = -2;
scene.add(sun);
const rim = new THREE.DirectionalLight(0x8866ff, 1.0);
rim.position.set(-2, 1, -2); scene.add(rim);
const fill = new THREE.PointLight(0x226688, 0.8, 6);
fill.position.set(0, 2, 0); scene.add(fill);

// ─── court floor ───────────────────────────────────────────────────────────
const floorY = 0.76; // ankle height in world space
const floorGeo = new THREE.PlaneGeometry(8, 12);
const floorMat = new THREE.MeshStandardMaterial({
  color: 0x8b4513, roughness: 0.8, metalness: 0.0
});
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI/2; floor.position.y = floorY;
floor.receiveShadow = true; scene.add(floor);

// Court lines
function courtLine(x1,z1,x2,z2) {
  const g = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(x1, floorY+0.002, z1),
    new THREE.Vector3(x2, floorY+0.002, z2)
  ]);
  const l = new THREE.Line(g, new THREE.LineBasicMaterial({color:0xffd280,opacity:0.4,transparent:true}));
  scene.add(l);
}
courtLine(-1.5,-2,-1.5,2); courtLine(1.5,-2,1.5,2);
courtLine(-1.5,0,1.5,0);

// ─── shadow blob under character ───────────────────────────────────────────
const shadowGeo = new THREE.CircleGeometry(0.22, 16);
const shadowMat = new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:0.35});
const shadowBlob = new THREE.Mesh(shadowGeo, shadowMat);
shadowBlob.rotation.x = -Math.PI/2; shadowBlob.position.y = floorY+0.001;
scene.add(shadowBlob);

// ─── basketball ────────────────────────────────────────────────────────────
const ballGroup = new THREE.Group();
const ballGeo = new THREE.SphereGeometry(0.12, 32, 24);
const ballMat = new THREE.MeshStandardMaterial({
  color: 0xe8650a, roughness: 0.7, metalness: 0.05
});
const ballMesh = new THREE.Mesh(ballGeo, ballMat);
ballMesh.castShadow = true; ballGroup.add(ballMesh);

// Seam lines (torus rings)
const seamMat = new THREE.MeshBasicMaterial({color:0x111111});
for(let i=0;i<3;i++){
  const t = new THREE.Mesh(new THREE.TorusGeometry(0.122, 0.004, 8, 32), seamMat);
  if(i===0){ /* equator */ }
  else if(i===1){ t.rotation.x = Math.PI/2; }
  else { t.rotation.y = Math.PI/2; t.rotation.z = 0.5; }
  ballGroup.add(t);
}
scene.add(ballGroup);

// ─── skeleton joints lookup ─────────────────────────────────────────────────
const NAMES = SKEL.names;
const NI = {}; NAMES.forEach((n,i)=>NI[n]=i);
const frames = SKEL.frames;
const FPS = SKEL.fps;

function p3(fr, name) {
  const pt = fr.p[NI[name]];
  return new THREE.Vector3(pt[0], -pt[1], pt[2]);
}

// ─── body materials ────────────────────────────────────────────────────────
const skinMat   = new THREE.MeshStandardMaterial({color:0xc8956c, roughness:0.8});
const shirtMat  = new THREE.MeshStandardMaterial({color:0x1a1a8c, roughness:0.7}); // navy
const shortsMat = new THREE.MeshStandardMaterial({color:0xffffff, roughness:0.7});
const shoeMat   = new THREE.MeshStandardMaterial({color:0x111111, roughness:0.6});

// ─── limb builder ──────────────────────────────────────────────────────────
function makeLimb(mat, radius) {
  // We'll update length dynamically — start with unit capsule
  const g = new THREE.CapsuleGeometry(radius, 0.3, 4, 8);
  const m = new THREE.Mesh(g, mat);
  m.castShadow = true;
  scene.add(m);
  return m;
}

function makeSphere(r, mat) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(r,12,8), mat);
  m.castShadow = true; scene.add(m); return m;
}

function makeBox(w,h,d,mat) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.castShadow = true; scene.add(m); return m;
}

// Body parts
const head      = makeSphere(0.11, skinMat);
const torso     = makeBox(0.29, 0.44, 0.15, shirtMat);
const pelvis    = makeBox(0.22, 0.12, 0.13, shortsMat);

// Arms
const l_upper_arm = makeLimb(shirtMat, 0.045);
const r_upper_arm = makeLimb(shirtMat, 0.045);
const l_forearm   = makeLimb(skinMat,  0.038);
const r_forearm   = makeLimb(skinMat,  0.038);
const l_hand      = makeSphere(0.035, skinMat);
const r_hand      = makeSphere(0.035, skinMat);

// Legs
const l_thigh  = makeLimb(shortsMat, 0.060);
const r_thigh  = makeLimb(shortsMat, 0.060);
const l_shin   = makeLimb(skinMat,   0.045);
const r_shin   = makeLimb(skinMat,   0.045);
const l_foot   = makeBox(0.08, 0.04, 0.14, shoeMat);
const r_foot   = makeBox(0.08, 0.04, 0.14, shoeMat);

// ─── skeleton bone lines ────────────────────────────────────────────────────
const BONE_PAIRS = [
  ['left_shoulder','right_shoulder'],
  ['left_shoulder','left_elbow'],['left_elbow','left_wrist'],
  ['right_shoulder','right_elbow'],['right_elbow','right_wrist'],
  ['left_shoulder','left_hip'],['right_shoulder','right_hip'],
  ['left_hip','right_hip'],
  ['left_hip','left_knee'],['left_knee','left_ankle'],
  ['right_hip','right_knee'],['right_knee','right_ankle'],
  ['nose','left_shoulder'],['nose','right_shoulder'],
];
const BONE_COLORS = [
  0xff6b6b,
  0x4ecdc4,0x4ecdc4,
  0x45b7d1,0x45b7d1,
  0xff6b6b,0xff6b6b,0xff6b6b,
  0x96ceb4,0x96ceb4,
  0x88d8b0,0x88d8b0,
  0xffd93d,0xffd93d
];

const boneGroup = new THREE.Group();
const boneMeshes = BONE_PAIRS.map((_,ci) => {
  const g = new THREE.BufferGeometry();
  const pos = new Float32Array(6);
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  const l = new THREE.Line(g, new THREE.LineBasicMaterial({color:BONE_COLORS[ci],linewidth:2}));
  boneGroup.add(l);
  return {l, attr: g.attributes.position};
});
const jointDots = [];
for(let i=0;i<33;i++){
  const m = new THREE.Mesh(
    new THREE.SphereGeometry(0.012,6,4),
    new THREE.MeshBasicMaterial({color:0x00e5ff})
  );
  boneGroup.add(m); jointDots.push(m);
}
// wrist joint dots bigger + yellow
[15,16].forEach(i => {
  jointDots[i].geometry = new THREE.SphereGeometry(0.022,8,6);
  jointDots[i].material = new THREE.MeshBasicMaterial({color:0xffd93d});
});
scene.add(boneGroup);

// ─── orientation helpers ────────────────────────────────────────────────────
const _up = new THREE.Vector3(0,1,0);
function orientLimb(mesh, pA, pB) {
  // reposition + orient capsule from pA to pB
  const mid = pA.clone().add(pB).multiplyScalar(0.5);
  mesh.position.copy(mid);
  const dir = pB.clone().sub(pA).normalize();
  const q = new THREE.Quaternion().setFromUnitVectors(_up, dir);
  mesh.quaternion.copy(q);
  // rebuild capsule with correct length
  const len = pA.distanceTo(pB);
  const r = mesh.geometry.parameters?.radius ?? 0.045;
  mesh.geometry.dispose();
  mesh.geometry = new THREE.CapsuleGeometry(r, Math.max(0.001, len - r*2), 4, 8);
}

// ─── ball physics ───────────────────────────────────────────────────────────
// Smooth ball position — follows dribble wrist with realistic drop
const ballY_smooth = { val: 0, vel: 0 };
let prevWristY = 0;
const BALL_R = 0.12;

function updateBall(fr, dt) {
  const rw = p3(fr, 'right_wrist');
  const lw = p3(fr, 'left_wrist');
  // dribble hand = whichever wrist is lower (more toward floor)
  const dribbleWrist = rw.y > lw.y ? rw : lw;
  const wristX = dribbleWrist.x;
  const wristZ = dribbleWrist.z;
  const wristY = dribbleWrist.y;
  const wristVelY = (wristY - prevWristY) / Math.max(dt, 0.001);
  prevWristY = wristY;

  // Ball Y: when hand goes down, ball is at hand; when hand goes up, ball bounces off floor
  let targetBallY;
  if(wristVelY < 0) {
    // hand going down = pushing ball down — ball is at wrist height
    targetBallY = wristY - BALL_R * 0.5;
  } else {
    // hand going up = ball is returning from floor
    const t = Math.min(1, wristVelY * 0.8);
    targetBallY = floorY + BALL_R + t * Math.abs(wristY - floorY - BALL_R);
  }
  targetBallY = Math.max(floorY + BALL_R, targetBallY);

  // Smooth
  ballY_smooth.val += (targetBallY - ballY_smooth.val) * 0.35;

  ballGroup.position.set(wristX, ballY_smooth.val, wristZ);
  // Spin the ball
  ballMesh.rotation.x += 0.08 * (wristVelY < 0 ? 1 : -1);
}

// ─── show/hide modes ────────────────────────────────────────────────────────
let showSkeleton = false, showBody = true;
function applyMode() {
  boneGroup.visible = showSkeleton;
  [head,torso,pelvis,l_upper_arm,r_upper_arm,l_forearm,r_forearm,l_hand,r_hand,
   l_thigh,r_thigh,l_shin,r_shin,l_foot,r_foot].forEach(m => m.visible = showBody);
}
applyMode();

// ─── frame update ───────────────────────────────────────────────────────────
function applyFrame(fi, dt) {
  const fr = frames[fi];
  const get = n => p3(fr, n);

  // Key joints
  const ls = get('left_shoulder'),  rs = get('right_shoulder');
  const lh = get('left_hip'),       rh = get('right_hip');
  const le = get('left_elbow'),     re = get('right_elbow');
  const lw = get('left_wrist'),     rw = get('right_wrist');
  const lk = get('left_knee'),      rk = get('right_knee');
  const la = get('left_ankle'),     ra = get('right_ankle');
  const nose = get('nose');

  // Computed centers
  const midShoulder = ls.clone().add(rs).multiplyScalar(0.5);
  const midHip      = lh.clone().add(rh).multiplyScalar(0.5);
  const midKneeL    = lk.clone();
  const midKneeR    = rk.clone();

  // HEAD
  const headPos = nose.clone();
  headPos.y += 0.08;
  head.position.copy(headPos);

  // TORSO — orient along shoulder-hip axis
  torso.position.copy(midShoulder.clone().add(midHip).multiplyScalar(0.5));
  const torsoDir = midShoulder.clone().sub(midHip).normalize();
  torso.quaternion.setFromUnitVectors(_up, torsoDir);

  // PELVIS
  pelvis.position.copy(midHip.clone().lerp(lh.clone().add(rh).multiplyScalar(0.5), 0.5));
  pelvis.quaternion.copy(torso.quaternion);

  // ARMS
  orientLimb(l_upper_arm, ls, le);
  orientLimb(l_forearm, le, lw);
  orientLimb(r_upper_arm, rs, re);
  orientLimb(r_forearm, re, rw);
  l_hand.position.copy(lw);
  r_hand.position.copy(rw);

  // LEGS
  orientLimb(l_thigh, lh, lk);
  orientLimb(l_shin, lk, la);
  orientLimb(r_thigh, rh, rk);
  orientLimb(r_shin, rk, ra);
  l_foot.position.copy(la);
  r_foot.position.copy(ra);

  // Shadow blob follows hip X/Z
  shadowBlob.position.x = midHip.x;
  shadowBlob.position.z = midHip.z;

  // Skeleton bones
  BONE_PAIRS.forEach(([a,b], ci) => {
    const va = get(a), vb = get(b);
    const attr = boneMeshes[ci].attr;
    attr.setXYZ(0, va.x, va.y, va.z);
    attr.setXYZ(1, vb.x, vb.y, vb.z);
    attr.needsUpdate = true;
  });
  fr.p.forEach((pt, i) => {
    jointDots[i].position.set(pt[0], -pt[1], pt[2]);
  });

  // Ball
  updateBall(fr, dt);

  // UI
  const pct = fi / (frames.length-1);
  document.getElementById('tl-fill').style.width = (pct*100)+'%';
  document.getElementById('finfo').textContent =
    `frame ${fr.f} / ${frames[frames.length-1].f}  ·  t=${(fr.t/1000).toFixed(3)}s`;
}

// ─── loop ───────────────────────────────────────────────────────────────────
let curFrame=0, playing=true, looping=true, speed=1, lastTs=null, accumMs=0;

function tick(ts) {
  requestAnimationFrame(tick);
  controls.update();
  const dt = lastTs ? (ts-lastTs)/1000 : 0;
  lastTs = ts;

  if(playing) {
    accumMs += dt * speed * 1000;
    const msPF = 1000/FPS;
    while(accumMs >= msPF) {
      accumMs -= msPF;
      curFrame++;
      if(curFrame >= frames.length) {
        curFrame = looping ? 0 : frames.length-1;
        if(!looping) playing = false;
      }
    }
  }
  applyFrame(curFrame, dt * speed);
  renderer.render(scene, camera);
}

function resize() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize); resize();

// ─── UI wiring ──────────────────────────────────────────────────────────────
document.getElementById('bp').onclick = () => {
  playing=!playing;
  document.getElementById('bp').textContent = playing?'⏸ Pause':'▶ Play';
};
document.getElementById('bl').onclick = e => {
  looping=!looping; e.target.classList.toggle('on',looping);
};
document.getElementById('bb').onclick = e => {
  showSkeleton=!showSkeleton; e.target.classList.toggle('on',showSkeleton); applyMode();
};
document.getElementById('bm').onclick = e => {
  showBody=!showBody; e.target.classList.toggle('on',showBody); applyMode();
};
document.getElementById('spdr').oninput = e => {
  speed=e.target.value/100;
  document.getElementById('spd').textContent=speed.toFixed(1)+'×';
};
document.getElementById('tl').onclick = e => {
  const r=document.getElementById('tl').getBoundingClientRect();
  curFrame=Math.round(Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*(frames.length-1));
  accumMs=0;
};

requestAnimationFrame(tick);
</script>
